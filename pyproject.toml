[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airscript-wiki"
version = "1.0.0"
description = "把 WPS AirScript 官方文档站抓取并转换为 Markdown 镜像（供每月 GitHub Actions 增量更新）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
airscript-wiki = "airscript_wiki.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
